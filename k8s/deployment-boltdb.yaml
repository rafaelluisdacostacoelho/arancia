---
# Deployment for Todo Service with BoltDB persistence
# This variant includes PersistentVolumeClaim mounting for database storage
# Use this instead of deployment.yaml when you need persistent storage
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-service
  namespace: todo-app
  labels:
    app: todo-service
    version: v1
    storage: boltdb
spec:
  # Number of pod replicas
  # Note: With ReadWriteOnce PVC, all replicas must be on the same node
  # For high availability with BoltDB, consider using StatefulSet instead
  replicas: 2
  
  # Selector to identify pods managed by this deployment
  selector:
    matchLabels:
      app: todo-service
  
  # Strategy for updating pods
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  
  # Pod template
  template:
    metadata:
      labels:
        app: todo-service
        version: v1
        storage: boltdb
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      # Security context for the pod
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000  # Important: Allows writing to mounted volume
      
      containers:
      - name: todo-service
        image: my-registry/todo-service:latest
        imagePullPolicy: IfNotPresent
        
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        
        # Environment variables from ConfigMap
        env:
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: todo-config
              key: PORT
        - name: STORAGE_BACKEND
          valueFrom:
            configMapKeyRef:
              name: todo-config
              key: STORAGE_BACKEND
        - name: BOLTDB_PATH
          valueFrom:
            configMapKeyRef:
              name: todo-config
              key: BOLTDB_PATH
        
        # Resource limits
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        
        # Liveness probe
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1
        
        # Readiness probe
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
          successThreshold: 1
        
        # Security context
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
        
        # Volume mount for BoltDB storage
        volumeMounts:
        - name: data
          mountPath: /data  # Mount the PVC at /data
          # subPath: todos  # Optional: create subdirectory
      
      # Volume definition - links to PersistentVolumeClaim
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: todo-boltdb-pvc  # References the PVC by name
