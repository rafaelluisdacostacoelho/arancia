---
# Service for Todo microservice
# Provides stable endpoint for accessing pods
apiVersion: v1
kind: Service
metadata:
  name: todo-service
  namespace: todo-app
  labels:
    app: todo-service
  annotations:
    # Optional: Add annotations for cloud load balancers if needed
    # For AWS: service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    # For GCP: cloud.google.com/load-balancer-type: "Internal"
spec:
  # Service type - ClusterIP makes it accessible only within the cluster
  # Change to LoadBalancer for external access or use Ingress
  type: ClusterIP
  
  # Selector to match pods managed by the deployment
  selector:
    app: todo-service
  
  # Ports configuration
  ports:
  - name: http
    protocol: TCP
    port: 80           # Service port (internal cluster access)
    targetPort: 8080   # Container port where app listens
  
  # Session affinity (optional - uncomment if needed)
  # sessionAffinity: ClientIP
  # sessionAffinityConfig:
  #   clientIP:
  #     timeoutSeconds: 10800
